<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Siddharth S S — Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset=".5" stop-color="#fff1f4"/><stop offset="1" stop-color="#fafafa"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7193f"/><stop offset=".5" stop-color="#e63b60"/><stop offset="1" stop-color="#b50e32"/></linearGradient>
  <radialGradient id="redGlow"><stop stop-color="#d7193f" stop-opacity=".35"/><stop offset="1" stop-color="#d7193f" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigGlow"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ecd6dc" stroke-width="1"/></pattern>
  <clipPath id="inside"><rect x="18" y="18" width="1164" height="584" rx="28"/></clipPath>
</defs>

<!-- base -->
<rect width="1200" height="620" fill="#ffffff"/>
<rect x="12" y="12" width="1176" height="596" rx="30" fill="url(#bg)" stroke="#d7193f" stroke-width="2" filter="url(#glow)"/>
<rect x="28" y="28" width="1144" height="564" rx="22" fill="url(#grid)" opacity=".6"/>

<!-- moving ambient glow -->
<g clip-path="url(#inside)">
 <circle cx="190" cy="240" r="190" fill="url(#redGlow)" filter="url(#bigGlow)">
   <animate attributeName="cx" values="150;360;150" dur="10s" repeatCount="indefinite"/>
   <animate attributeName="cy" values="220;390;220" dur="8s" repeatCount="indefinite"/>
 </circle>
 <circle cx="1000" cy="390" r="210" fill="url(#redGlow)" filter="url(#bigGlow)">
   <animate attributeName="cx" values="1020;820;1020" dur="12s" repeatCount="indefinite"/>
 </circle>
</g>

<!-- top chrome -->
<circle cx="52" cy="55" r="6" fill="#ff5f56"/><circle cx="72" cy="55" r="6" fill="#ffbd2e"/><circle cx="92" cy="55" r="6" fill="#27c93f"/>
<text x="125" y="60" fill="#ff416c" font-family="monospace" font-size="14">siddharth-ss / README.md</text>
<text x="850" y="59" fill="#666" font-family="monospace" font-size="11">&lt;/&gt; CODE</text>
<text x="930" y="59" fill="#666" font-family="monospace" font-size="11">PROJECTS</text>
<text x="1025" y="59" fill="#666" font-family="monospace" font-size="11">CONTACT</text>

<!-- left hero -->
<rect x="50" y="92" width="470" height="475" rx="20" fill="#ffffff" fill-opacity=".88" stroke="#d49aa8"/>
<text x="75" y="121" fill="#ff416c" font-family="monospace" font-size="12" font-weight="700" letter-spacing="3">CORE.MODULE</text>
<text x="75" y="150" fill="#181818" font-family="monospace" font-size="27" font-weight="700">SIDDHARTH S S</text>
<text x="75" y="174" fill="#ff416c" font-family="monospace" font-size="12">PYTHON • WEB • TOOLING</text>

<!-- animated reactor -->
<g transform="translate(285 315)">
 <circle r="145" fill="none" stroke="#e8c5cc" stroke-width="1"/>
 <circle r="112" fill="none" stroke="#c96a7c" stroke-width="1" stroke-dasharray="3 9">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
 </circle>
 <circle r="82" fill="none" stroke="#d7193f" stroke-width="1" stroke-dasharray="1 12" opacity=".8">
   <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
 </circle>
 <circle r="54" fill="#d7193f" opacity=".08"><animate attributeName="r" values="45;62;45" dur="3s" repeatCount="indefinite"/></circle>
 <circle r="12" fill="#d7193f" filter="url(#glow)"><animate attributeName="r" values="9;15;9" dur="2s" repeatCount="indefinite"/></circle>
 <!-- rotating satellites -->
 <g fill="#ff416c" filter="url(#glow)">
   <circle cx="0" cy="-112" r="5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></circle>
   <circle cx="82" cy="0" r="4"><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="7s" repeatCount="indefinite"/></circle>
   <circle cx="0" cy="82" r="4"><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="6s" repeatCount="indefinite"/></circle>
 </g>
 <!-- pulse rings -->
 <circle r="30" fill="none" stroke="#d7193f" stroke-width="2">
   <animate attributeName="r" values="25;125;25" dur="4s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values=".8;0;.8" dur="4s" repeatCount="indefinite"/>
 </circle>
</g>

<!-- scanline -->
<rect x="68" y="190" width="434" height="2" fill="#d7193f" opacity=".75">
 <animate attributeName="y" values="190;535;190" dur="4.5s" repeatCount="indefinite"/>
</rect>

<text x="75" y="520" fill="#666" font-family="monospace" font-size="10">SYSTEM</text>
<text x="140" y="520" fill="#39ff88" font-family="monospace" font-size="10">ONLINE</text>
<text x="75" y="542" fill="#666" font-family="monospace" font-size="10">BUILD</text>
<text x="140" y="542" fill="#ff416c" font-family="monospace" font-size="10">ACTIVE</text>

<!-- right console -->
<rect x="540" y="92" width="610" height="475" rx="20" fill="#ffffff" fill-opacity=".9" stroke="#d49aa8"/>
<text x="565" y="121" fill="#ff416c" font-family="monospace" font-size="12" font-weight="700" letter-spacing="3">TERMINAL.SESSION</text>
<circle cx="1100" cy="116" r="5" fill="#39ff88"><animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="1118" y="120" text-anchor="end" fill="#39ff88" font-family="monospace" font-size="10">CONNECTED</text>

<text x="565" y="160" fill="#222" font-family="monospace" font-size="13">siddharth@developer:~$ whoami</text>
<text x="565" y="184" fill="#ff416c" font-family="monospace" font-size="13">Siddharth S S</text>

<g font-family="monospace" font-size="12">
 <text x="565" y="218" fill="#ff416c">&gt; ROLE</text><text x="700" y="218" fill="#181818">Python Developer · Web Developer</text>
 <text x="565" y="246" fill="#ff416c">&gt; FOCUS</text><text x="700" y="246" fill="#181818">Practical software &amp; developer tools</text>
 <text x="565" y="274" fill="#ff416c">&gt; STACK</text><text x="700" y="274" fill="#181818">Python · PHP · JavaScript · Flask</text>
 <text x="700" y="296" fill="#181818">MySQL · MongoDB · Git · GitHub</text>
 <text x="565" y="330" fill="#ff416c">&gt; PROJECT</text><text x="700" y="330" fill="#181818">github-profile-toolkit</text>
 <text x="700" y="352" fill="#666">Python toolkit for GitHub profiles</text>
</g>

<!-- activity graph -->
<text x="565" y="390" fill="#666" font-family="monospace" font-size="10">LIVE ACTIVITY</text>
<g transform="translate(565 405)">
 <path d="M0 65 L45 42 L90 58 L135 20 L180 45 L225 10 L270 38 L315 18 L360 50 L405 25 L450 42 L495 8" fill="none" stroke="#d7193f" stroke-width="2" filter="url(#glow)" stroke-dasharray="700" stroke-dashoffset="700">
  <animate attributeName="stroke-dashoffset" values="700;0;700" dur="5s" repeatCount="indefinite"/>
 </path>
 <path d="M0 65 L45 42 L90 58 L135 20 L180 45 L225 10 L270 38 L315 18 L360 50 L405 25 L450 42 L495 8 L495 75 L0 75Z" fill="#d7193f" opacity=".06"/>
</g>

<!-- terminal typing effect -->
<text x="565" y="510" fill="#ff416c" font-family="monospace" font-size="12">siddharth@developer:~$</text>
<text x="730" y="510" fill="#181818" font-family="monospace" font-size="12">build --ship</text>
<rect x="815" y="498" width="7" height="15" fill="#ff416c"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>

<!-- animated perimeter -->
<rect x="22" y="22" width="1156" height="576" rx="30" fill="none" stroke="#d7193f" stroke-width="1" opacity=".2">
 <animate attributeName="opacity" values=".1;.7;.1" dur="3.5s" repeatCount="indefinite"/>
</rect>
<line x1="40" y1="583" x2="1160" y2="583" stroke="url(#hot)" stroke-width="2">
 <animate attributeName="x1" values="40;480;40" dur="5s" repeatCount="indefinite"/>
 <animate attributeName="x2" values="1160;760;1160" dur="5s" repeatCount="indefinite"/>
</line>
</svg>